  <style>

      --sidebar-bg: #1e293b;

    }

    body {
      font-family: 'Inter', sans-serif;

      overflow-x: hidden;
    }

    #sidebar {
      min-width: 260px;
      max-width: 260px;
      background-color: var(--sidebar-bg);
      min-height: 100vh;
      transition: all 0.3s;
    }

    .sidebar-link {
      color: #94a3b8;
      text-decoration: none;
      padding: 12px 20px;
      display: block;
      transition: all 0.2s;
      border-radius: 8px;
      margin: 4px 12px;
    }

    .sidebar-link:hover, .sidebar-link.active {
      background-color: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .main-content {
      width: 100%;
      padding: 30px;
    }

    .loader {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.7);
      z-index: 9999;
      justify-content: center;
      align-items: center;

  </style>
</head>
<body>

  <div class="loader" id="globalLoader">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <div class="d-flex">
    <div id="sidebar" class="text-white pt-4">
      <div class="px-4 mb-4">
        <h5 class="fw-bold text-accent"><i class="bi bi-shirt-fill me-2"></i>ALPRO UNIFORM</h5>
        <small class="text-muted">HQ Operation Support</small>
      </div>
      <nav class="mt-4">
        <a href="#" class="sidebar-link active" onclick="switchMenu('dashboard', this)"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
        <a href="#" class="sidebar-link" onclick="switchMenu('stok', this)"><i class="bi bi-box-seam me-2"></i> Master Stok Gudang</a>
        <a href="#" class="sidebar-link" onclick="switchMenu('request', this)"><i class="bi bi-clipboard-plus me-2"></i> Request (Alokasi Keluar)</a>
        <a href="#" class="sidebar-link" onclick="switchMenu('seragam_masuk', this)"><i class="bi bi-arrow-down-left-circle me-2"></i> Seragam Masuk</a>
        <a href="#" class="sidebar-link" onclick="switchMenu('peminjaman', this)"><i class="bi bi-arrow-up-right-circle me-2"></i> Peminjaman Event</a>
        <a href="#" class="sidebar-link" onclick="switchMenu('transaksi', this)"><i class="bi bi-arrow-left-right me-2"></i> Riwayat Transaksi</a>
        <hr style="border-color: rgba(255,255,255,0.1); margin: 8px 12px;">
        <a href="#" class="sidebar-link" onclick="switchMenu('destroy', this)"><i class="bi bi-trash3-fill me-2"></i> Seragam Destroy</a>
        <a href="#" class="sidebar-link" onclick="switchMenu('master_aset', this)"><i class="bi bi-people-fill me-2"></i> Master Aset Karyawan</a>
      </nav>
    </div>

    <div class="main-content">
      <div id="app"></div>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    // ✅ KREDENSIAL ASLI SUPABASE KAMU SUDAH DISINKRONKAN
    const SUPABASE_URL = "https://djtrwfebcykgleepptcv.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqdHJ3ZmViY3lrZ2xlZXBwdGN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNzI1MjgsImV4cCI6MjA5OTg0ODUyOH0.NEe33LE-aaSsWz6Vy9P1YwFn7hkac4fSGi3dMzHKa9M";

    const supabaseHeaders = {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json"
    };

    function showLoader(show) {
      const loader = document.getElementById('globalLoader');
      if (loader) loader.style.display = show ? 'flex' : 'none';
    }

    function showError(message) {
      document.getElementById('app').innerHTML = `
        <div class="alert alert-danger p-4 shadow-sm" role="alert">
          <h4 class="alert-heading fw-bold"><i class="bi bi-exclamation-triangle-fill me-2"></i> Gagal Memuat Data!</h4>
          <p>Terjadi kendala koneksi. Pastikan nama laci tabel & kolom di Supabase sudah dibuat dengan huruf kecil semua.</p>
          <hr>
          <p class="mb-0 small">Pesan Sistem / Error Log: <code>${message}</code></p>
        </div>
      `;
    }

    function switchMenu(menu, element) {
      document.querySelectorAll('.sidebar-link').forEach(el => el.classList.remove('active'));
      if (element) element.classList.add('active');
      
      if(menu === 'dashboard') renderDashboard();
      if(menu === 'stok') renderStokGudang();
      if(menu === 'request') renderRequestSeragam();
      if(menu === 'seragam_masuk') renderSeragamMasuk();
      if(menu === 'peminjaman') renderPeminjamanEvent();
      if(menu === 'transaksi') renderRiwayatTransaksi();
      if(menu === 'destroy') renderSeragamDestroy();
      if(menu === 'master_aset') renderMasterAsetKaryawan();
    }

    // ==========================================
    // 1. MENU DASHBOARD SUMMARY
    // ==========================================
    async function renderDashboard() {
      showLoader(true);
      try {
        const [resRingkasan, resRequest, resTx] = await Promise.all([
          fetch(`${SUPABASE_URL}/rest/v1/dashboard_ringkasan_gudang`, { headers: supabaseHeaders }),
          fetch(`${SUPABASE_URL}/rest/v1/request_seragam?select=departemen_cabang`, { headers: supabaseHeaders }),
          fetch(`${SUPABASE_URL}/rest/v1/transaksi_seragam?tipe_transaksi=eq.KELUAR&select=seragam_id,jumlah`, { headers: supabaseHeaders })
        ]);

        if(!resRingkasan.ok) throw new Error(`HTTP ${resRingkasan.status} - Gagal memuat view ringkasan dashboard.`);
        
        const data = await resRingkasan.json();
        const d = data[0] || { total_stok_baru_layak: 0, total_request_pending: 0, alokasi_bulan_ini: 0, peminjaman_aktif: 0, varian_stok_kritis: 0 };

        // Agregasi Top Cabang dari data request
        let topCabangRows = '<tr><td colspan="2" class="text-center text-muted">Data tidak tersedia.</td></tr>';
        if (resRequest.ok) {
          const dataRequest = await resRequest.json();
          const cabangCount = dataRequest.reduce((acc, r) => {
            const key = r.departemen_cabang || 'Tidak Diketahui';
            acc[key] = (acc[key] || 0) + 1;
            return acc;
          }, {});
          const sortedCabang = Object.entries(cabangCount).sort((a, b) => b[1] - a[1]).slice(0, 7);
          if (sortedCabang.length > 0) {
            topCabangRows = sortedCabang.map(([nama, jumlah], i) => `
              <tr>
                <td><span class="badge bg-secondary me-2">${i + 1}</span>${nama}</td>
                <td class="fw-bold text-primary text-end">${jumlah} request</td>
              </tr>
            `).join('');
          }
        }

        // Agregasi Varian Paling Dibutuhkan dari transaksi KELUAR
        let topVarianRows = '<tr><td colspan="2" class="text-center text-muted">Data tidak tersedia.</td></tr>';
        if (resTx.ok) {
          const dataTx = await resTx.json();
          const varianCount = dataTx.reduce((acc, t) => {
            const key = `ID Seragam #${t.seragam_id}`;
            acc[key] = (acc[key] || 0) + (t.jumlah || 0);
            return acc;
          }, {});
          const sortedVarian = Object.entries(varianCount).sort((a, b) => b[1] - a[1]).slice(0, 7);
          if (sortedVarian.length > 0) {
            topVarianRows = sortedVarian.map(([nama, jumlah], i) => `
              <tr>
                <td><span class="badge bg-secondary me-2">${i + 1}</span>${nama}</td>
                <td class="fw-bold text-danger text-end">${jumlah} pcs keluar</td>
              </tr>
            `).join('');
          }
        }

        document.getElementById('app').innerHTML = `
          <h3 class="fw-bold mb-4">Dashboard Ringkasan</h3>
          <div class="row g-4">
            <div class="col-md-4">
              <div class="card border-0 shadow-sm p-4 bg-white">
                <div class="text-muted small text-uppercase fw-bold">Stok Baru / Layak</div>
                <div class="display-5 fw-bold text-primary mt-2">${d.total_stok_baru_layak} <span class="fs-6 text-muted">pcs</span></div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="card border-0 shadow-sm p-4 bg-white">
                <div class="text-muted small text-uppercase fw-bold">Request Pending</div>
                <div class="display-5 fw-bold text-warning mt-2">${d.total_request_pending} <span class="fs-6 text-muted">surat</span></div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="card border-0 shadow-sm p-4 bg-white">
                <div class="text-muted small text-uppercase fw-bold">Alokasi Bulan Ini</div>
                <div class="display-5 fw-bold text-success mt-2">${d.alokasi_bulan_ini} <span class="fs-6 text-muted">pcs</span></div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="card border-0 shadow-sm p-4 bg-white">
                <div class="text-muted small text-uppercase fw-bold">Peminjaman Status Hack Aktif</div>
                <div class="display-6 fw-bold text-info mt-2">${d.peminjaman_aktif} <span class="fs-6 text-muted">item</span></div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="card border-0 shadow-sm p-4 bg-white">
                <div class="text-muted small text-uppercase fw-bold">Varian Jenis Seragam Kritis</div>
                <div class="display-6 fw-bold text-danger mt-2">${d.varian_stok_kritis} <span class="fs-6 text-muted">varian (≤ 5 pcs)</span></div>
              </div>
            </div>
          </div>

          <!-- SECTION TABEL RINGKASAN ANALITIK -->
          <div class="row g-4 mt-2">
            <div class="col-md-6">
              <div class="card border-0 shadow-sm bg-white h-100">
                <div class="card-header bg-white border-bottom py-3 d-flex align-items-center gap-2">
                  <i class="bi bi-building text-primary fs-5"></i>
                  <span class="fw-bold">Top Request Cabang / Departemen</span>
                </div>
                <div class="card-body p-0">
                  <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                      <tr>
                        <th class="ps-3 small text-uppercase text-muted">Cabang / Departemen</th>
                        <th class="pe-3 small text-uppercase text-muted text-end">Jumlah Request</th>
                      </tr>
                    </thead>
                    <tbody class="ps-3">
                      ${topCabangRows}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="card border-0 shadow-sm bg-white h-100">
                <div class="card-header bg-white border-bottom py-3 d-flex align-items-center gap-2">
                  <i class="bi bi-graph-up-arrow text-danger fs-5"></i>
                  <span class="fw-bold">Tren Varian Seragam Paling Dibutuhkan</span>
                </div>
                <div class="card-body p-0">
                  <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                      <tr>
                        <th class="ps-3 small text-uppercase text-muted">Varian Seragam</th>
                        <th class="pe-3 small text-uppercase text-muted text-end">Total Keluar</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${topVarianRows}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        `;
      } catch (err) { 
        console.error(err); 
        showError(err.message);
      } finally {
        showLoader(false);
      }
    }

    // ==========================================
    // 2. MENU MASTER STOK GUDANG (monitor_stok_gudang)
    // ==========================================
    async function renderStokGudang() {
      showLoader(true);
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/monitor_stok_gudang?order=seragam_id.asc`, { headers: supabaseHeaders });
        if(!res.ok) throw new Error(`HTTP ${res.status} - Gagal mengambil data laci 'monitor_stok_gudang'.`);
        
        const data = await res.json();

        let rows = data.map(s => `
          <tr>
            <td><strong>#${s.seragam_id || ''}</strong></td>
            <td>${s.nama_seragam || ''}</td>
            <td><span class="badge bg-light text-dark">${s.gender || ''}</span></td>
            <td><span class="fw-bold">${s.ukuran || ''}</span></td>
            <td class="text-success fw-bold">${s.stok_baru_dan_layak ?? 0} pcs</td>
            <td class="text-warning fw-bold">${s.stok_event ?? 0} pcs</td>
            <td class="text-danger fw-bold">${s.stok_bekas_tidak_layak ?? 0} pcs</td>
            <td class="table-primary fw-bold text-center">${s.stok_total_fisik ?? s.total_stok_fisik ?? 0} pcs</td>
          </tr>
        `).join('');

        document.getElementById('app').innerHTML = `
          <div class="card p-4 shadow-sm border-0 bg-white">
            <h4 class="fw-bold mb-4 text-primary"><i class="bi bi-box-seam me-2"></i>Master Transparansi Stok Gudang</h4>
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light text-uppercase small">
                  <tr>
                    <th>Kode Seragam</th><th>Nama Item</th><th>Gender</th><th>Ukuran</th>
                    <th>Baru / Layak</th><th>Bekas (Event)</th><th>Tidak Layak (Destroy)</th><th class="text-center">Total Fisik Gudang</th>
                  </tr>
                </thead>
                <tbody>${rows || '<tr><td colspan="8" class="text-center">Gudang kosong.</td></tr>'}</tbody>
              </table>
            </div>
          </div>
        `;
      } catch (err) { 
        console.error(err); 
        showError(err.message);
      } finally {
        showLoader(false);
      }
    }

    // ==========================================
    // 3. MENU REQUEST SERAGAM (request_seragam)
    // ==========================================
    async function renderRequestSeragam() {
  showLoader(true);
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/request_seragam?order=id.desc`, { headers: supabaseHeaders });
    if(!res.ok) throw new Error(`HTTP ${res.status} - Gagal memuat data laci 'request_seragam'.`);
    
    const dataRaw = await res.json();

    // 🌟 KUNCI PERBAIKAN: Saring agar data yang berstatus 'Disetujui' langsung dieliminasi dari layar
    const data = dataRaw.filter(r => r.status_request !== 'Disetujui');

    let rows = data.map(r => `
      <tr>
        <td>${r.nama_karyawan || ''} (NIP: ${r.nip || '-'})</td>
        <td>${r.posisi_kerja || ''}</td>
        <td>${r.departemen_cabang || ''}</td>
        <td><span class="badge bg-info text-dark">${r.gender_karyawan || '-'}</span></td>
        <td><small>Jas: ${r.ukuran_jas || '-'}<br>Kemeja: ${r.ukuran_kemeja || '-'}<br>Kaos: ${r.ukuran_kaos || '-'}</small></td>
        <td>
          <select class="form-select form-select-sm fw-bold ${r.status_request === 'Disetujui' ? 'text-success' : 'text-warning'}" 
            onchange="ubahStatusRequest(${r.id}, this.value)">
            <option value="Pending" ${r.status_request === 'Pending' ? 'selected' : ''}>⏳ Pending</option>
            <option value="Disetujui" ${r.status_request === 'Disetujui' ? 'selected' : ''}>✅ Disetujui</option>
          </select>
        </td>
      </tr>
    `).join('');
    
        document.getElementById('app').innerHTML = `
          <div class="card p-4 shadow-sm border-0 bg-white mb-4">
            <h5 class="fw-bold text-dark mb-2"><i class="bi bi-file-earmark-spreadsheet-fill text-success me-2"></i>Upload Request Seragam via CSV</h5>
            <div class="row g-3 align-items-center mt-1">
              <div class="col-auto"><input type="file" id="csvFilePicker" accept=".csv" class="form-control form-control-sm"></div>
              <div class="col-auto"><button class="btn btn-sm btn-primary px-3" onclick="eksekusiUploadCSV()"><i class="bi bi-cloud-upload me-1"></i> Jalankan Upload</button></div>
              <div class="col-auto"><button class="btn btn-sm btn-outline-success px-3" onclick="downloadTemplateRequest()"><i class="bi bi-download me-1"></i> Download Template CSV</button></div>
            </div>
          </div>

          <div class="card p-4 shadow-sm border-0 bg-white">
            <h4 class="fw-bold mb-4 text-primary">Daftar Permintaan Jatah Seragam Karyawan</h4>
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light text-uppercase small">
                  <tr><th>Nama Karyawan</th><th>Posisi</th><th>Cabang</th><th>Gender</th><th>Ukuran Jatah</th><th>Status</th></tr>
                </thead>
                <tbody>${rows || '<tr><td colspan="6" class="text-center">Belum ada data permintaan.</td></tr>'}</tbody>
              </table>
            </div>
          </div>
        `;
      } catch (err) { 
        console.error(err); 
        showError(err.message);
      } finally {
        showLoader(false);
      }
    }

    async function ubahStatusRequest(id, statusBaru) {
      showLoader(true);
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/request_seragam?id=eq.${id}`, {
          method: "PATCH",
          headers: supabaseHeaders,
          body: JSON.stringify({ status_request: statusBaru })
        });
        if (res.ok) {
          Swal.fire('Berhasil!', `Status diperbarui menjadi ${statusBaru}.`, 'success');
          renderRequestSeragam();
        } else {
          throw new Error("Gagal merubah status request.");
        }
      } catch (err) { 
        Swal.fire('Gagal!', err.message, 'error'); 
      } finally {
        showLoader(false);
      }
    }

    // ==========================================

// Penampung data riwayat mutasi untuk filter & export CSV
let cachedTransactions = [];
let filteredTransactions = [];

    async function renderSeragamMasuk() {

    document.getElementById('app').innerHTML = `

          <div class="card p-4 shadow-sm border-0 bg-white mb-4">
            <label class="fw-bold mb-2">Pilih Kategori Seragam Masuk:</label>
            <select id="sumberMasukSelect" class="form-select w-50" onchange="toggleAlurMasuk(this.value)">
              <option value="">-- Pilih Kategori Masuk --</option>
              <option value="Vendor">🏭 Kiriman Baru dari Vendor (Upload CSV)</option>
              <option value="Resign">👤 Karyawan Resign (Multi-input / Sekali Submit)</option>

  <div class="row g-3 align-items-center">
    <div class="col-auto"><input type="file" id="vendorCsvPicker" accept=".csv" class="form-control form-control-sm"></div>
    <div class="col-auto"><button class="btn btn-sm btn-success px-3" onclick="eksekusiUploadCSVVendor()"><i class="bi bi-upload me-1"></i> Upload</button></div>
    
    <div class="col-auto">
      <button class="btn btn-sm btn-outline-success px-3" onclick="downloadTemplateVendor()">
        <i class="bi bi-download me-1"></i> Download Template CSV Vendor

  </div>
</div>

          <div id="alurResignArea" class="card p-4 shadow-sm border-0 bg-white d-none">

            <form id="formResignMassal" onsubmit="simpanResignMassal(event)">

                </div>

                  <label class="form-label small fw-bold">Departemen / Cabang</label>

                </div>
              </div>
              
              <div class="table-responsive mb-3">
                <table class="table table-bordered align-middle">
                  <thead class="table-light small text-uppercase">

                    </tr>
                  </thead>
                  <tbody id="resignItemsTableBody">
                    </tbody>
                </table>
              </div>

    // Fungsi memproses seluruh baris inputan sekaligus ke Supabase transaksi_seragam
    async function simpanResignMassal(e) {
      e.preventDefault();
      showLoader(true);
      
      const namaKaryawan = document.getElementById('resignNama').value.trim();
      const posisiKaryawan = document.getElementById('resignPosisi').value.trim();
      const cabangKaryawan = document.getElementById('resignCabang').value.trim();
      const rows = document.querySelectorAll('.resign-item-row');
      const jsonPaketData = [];

      // Kelompokkan per seragam_id & kondisi untuk update stok_seragam
      const stokLayakMap  = {}; // seragam_id -> total qty layak
      const stokDestroyMap = {}; // seragam_id -> total qty tidak layak
      
      rows.forEach(row => {
        const idSeragam = parseInt(row.querySelector('.select-seragam-id').value);
        const qty = parseInt(row.querySelector('.input-jumlah').value);
        const jenisSumber = row.querySelector('.select-kondisi').value;
        
        if (idSeragam && qty) {
          jsonPaketData.push({
            tipe_transaksi: "MASUK",
            jenis_sumber: jenisSumber,
            seragam_id: idSeragam,
            jumlah: qty,
            keterangan: `Pengembalian baju dari karyawan resign: ${namaKaryawan} (${posisiKaryawan} - ${cabangKaryawan}). Status: ${jenisSumber}`
          });

          if (jenisSumber === 'Resign - Bekas Layak') {
            stokLayakMap[idSeragam]   = (stokLayakMap[idSeragam]   || 0) + qty;
          } else if (jenisSumber === 'Resign - Destroy') {
            stokDestroyMap[idSeragam] = (stokDestroyMap[idSeragam] || 0) + qty;
          }
        }
      });

      if (jsonPaketData.length === 0) {
        Swal.fire('Peringatan!', 'Belum ada item baju jatah seragam yang dipilih.', 'warning');
        showLoader(false);
        return;
      }

      try {
        // 1. Insert log ke transaksi_seragam (batch)
        const resTx = await fetch(`${SUPABASE_URL}/rest/v1/transaksi_seragam`, {
          method: "POST",
          headers: supabaseHeaders,
          body: JSON.stringify(jsonPaketData)
        });
        if (!resTx.ok) throw new Error("Gagal menyimpan log transaksi resign ke Supabase.");

        // 2. Update stok_seragam per seragam_id
        // — Layak: tambah stok_bagus (bisa dipakai lagi)
        const updateLayakPromises = Object.entries(stokLayakMap).map(([seragamId, qty]) =>
          fetch(`${SUPABASE_URL}/rest/v1/rpc/increment_stok`, {
            method: "POST",
            headers: supabaseHeaders,
            body: JSON.stringify({ p_seragam_id: parseInt(seragamId), p_kolom: 'stok_bagus', p_qty: qty })
          })
        );
        // — Tidak Layak: tambah stok_destroy
        const updateDestroyPromises = Object.entries(stokDestroyMap).map(([seragamId, qty]) =>
          fetch(`${SUPABASE_URL}/rest/v1/rpc/increment_stok`, {
            method: "POST",
            headers: supabaseHeaders,
            body: JSON.stringify({ p_seragam_id: parseInt(seragamId), p_kolom: 'stok_destroy', p_qty: qty })
          })
        );

        await Promise.all([...updateLayakPromises, ...updateDestroyPromises]);

        Swal.fire('Sukses Menyimpan!', `Berhasil mencatat ${jsonPaketData.length} item pengembalian seragam ${namaKaryawan}! Stok gudang telah diperbarui.`, 'success');
        renderSeragamMasuk();
      } catch (err) {
        Swal.fire('Gagal!', err.message, 'error');
      } finally {
        showLoader(false);
      }
    }

// Fungsi menyuntikkan baris data ke dalam elemen tabel HTML
function updateTransactionTableRows(dataList) {
  const tbody = document.getElementById('transaksiTableBody');
  if (!tbody) return;
  
  if (dataList.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">Tidak ada data transaksi mutasi yang cocok dengan filter.</td></tr>';
    return;
  }

  tbody.innerHTML = dataList.map(t => `
    <tr>
      <td><small>${t.tanggal_transaksi ? new Date(t.tanggal_transaksi).toLocaleString('id-ID') : '-'}</small></td>
      <td><span class="badge ${t.tipe_transaksi === 'MASUK' ? 'bg-success' : 'bg-danger'}">${t.tipe_transaksi || ''}</span></td>
      <td><strong class="text-dark">${t.jenis_sumber || ''}</strong></td>

      <td class="fw-bold">${t.jumlah ?? 0} pcs</td>
      <td><span class="text-muted small">${t.keterangan || '-'}</span></td>
    </tr>
  `).join('');
}

// Logika penyaringan murni real-time berdasarkan input komponen filter
function applyTransactionFilters() {
  const keyword = document.getElementById('txSearchInput').value.toLowerCase().trim();
  const type = document.getElementById('txTypeSelect').value;
  const startDateStr = document.getElementById('txStartDate').value;
  const endDateStr = document.getElementById('txEndDate').value;

  filteredTransactions = cachedTransactions.filter(t => {
    // 1. Cek kecocokan keyword pencarian pada kolom keterangan atau jenis sumber
    const textKet = (t.keterangan || '').toLowerCase();
    const textSumber = (t.jenis_sumber || '').toLowerCase();
    const matchKeyword = textKet.includes(keyword) || textSumber.includes(keyword);

    // 2. Cek kecocokan tipe mutasi (MASUK/KELUAR)
    const matchType = type === "" || t.tipe_transaksi === type;

    // 3. Cek pembatasan rentang periode tanggal audit manajemen
    let matchDate = true;
    if (t.tanggal_transaksi) {
      const txDate = new Date(t.tanggal_transaksi);
      if (startDateStr) {
        const start = new Date(startDateStr);
        start.setHours(0,0,0,0);
        if (txDate < start) matchDate = false;
      }
      if (endDateStr) {
        const end = new Date(endDateStr);
        end.setHours(23,59,59,999);
        if (txDate > end) matchDate = false;
      }
    } else if (startDateStr || endDateStr) {
      matchDate = false;
    }

    return matchKeyword && matchType && matchDate;
  });

  // Render ulang isi tabel sesuai hasil saringan terbaru
  updateTransactionTableRows(filteredTransactions);
}

// Fungsi ekspor otomatis ke file Microsoft Excel / CSV murni data yang terfilter saja
// ==========================================
// FIX ENGINE: DOWNLOAD CSV TANPA GESER KOLOM
// ==========================================
function downloadFilteredTxCSV() {
  if (filteredTransactions.length === 0) {
    Swal.fire('Info', 'Tidak ada data hasil filter yang bisa diunduh, Kak Ahmad!', 'info');
    return;
  }
  
  const header = ["waktu_catat", "tipe_transaksi", "jenis_sumber_alur", "id_seragam", "jumlah_mutasi", "keterangan"];
  const data = filteredTransactions.map(t => {
    // 🌟 KUNCI PERBAIKAN: Hilangkan koma pada tanggal agar tidak memecah kolom CSV saat di-join
    let waktuFormat = '-';
    if (t.tanggal_transaksi) {
      waktuFormat = new Date(t.tanggal_transaksi).toLocaleString('id-ID').replace(',', '');
    }
    
    // Proteksi ekstra: Bungkus semua data teks dengan tanda kutip ganda 
    // agar jika nama vendor atau keterangan berisi koma, Excel tidak akan pecah/geser
    const jenisSumberClean = `"${(t.jenis_sumber || '').replace(/"/g, '""')}"`;
    const keteranganClean = `"${(t.keterangan || '').replace(/"/g, '""')}"`;

    return [
      waktuFormat,
      t.tipe_transaksi || '',
      jenisSumberClean,
      t.seragam_id || '',
      t.jumlah || 0,
      keteranganClean
    ];
  });

  triggerDownload("laporan_audit_mutasi_seragam.csv", header, data);
}

      const data = [["1", "50", "INV-ALPRO-2026-001"], ["2", "100", "INV-ALPRO-2026-001"]];

    function triggerDownload(filename, header, rows) {
      let csvContent = header.join(",") + "\n" + rows.map(r => r.join(",")).join("\n");
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.setAttribute("download", filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function eksekusiUploadCSV() {
      const filePicker = document.getElementById('csvFilePicker');
      if (!filePicker || filePicker.files.length === 0) { Swal.fire('Waduh!', 'Pilih file .csv jatah karyawan terlebih dahulu!', 'warning'); return; }
      const file = filePicker.files[0];
      const reader = new FileReader();
      showLoader(true);
      reader.onload = async function (e) {
        try {
          const lines = e.target.result.split("\n");
          const jsonBody = [];
          for (let i = 1; i < lines.length; i++) {
            const row = lines[i].split(",");
            if (row.length < 5 || row[0].trim() === "") continue;
            jsonBody.push({
              nama_karyawan: row[0].trim(),
              nip: row[1].trim(),
              posisi_kerja: row[2].trim(),
              departemen_cabang: row[3].trim(),
              jenis_request: row[4].trim(),
              gender_karyawan: row[5].trim(),
              ukuran_jas: row[6]?.trim() === 'NULL' || !row[6] ? null : row[6].trim(),
              ukuran_kemeja: row[7]?.trim() === 'NULL' || !row[7] ? null : row[7].trim(),
              ukuran_kaos: row[8]?.trim() === 'NULL' || !row[8] ? null : row[8].trim()
            });
          }
          const res = await fetch(`${SUPABASE_URL}/rest/v1/request_seragam`, {
            method: "POST", headers: { ...supabaseHeaders, "Prefer": "return=minimal" }, body: JSON.stringify(jsonBody)
          });
          if (res.ok) { 
            Swal.fire('Sukses!', `${jsonBody.length} data request berhasil di-upload massal!`, 'success'); 
            renderRequestSeragam(); 
          } else {
            throw new Error("Gagal mengunggah ke laci request_seragam.");
          }
        } catch (err) { 
          Swal.fire('Gagal!', err.message, 'error'); 
        } finally {
          showLoader(false);
        }
      };
      reader.readAsText(file);
    }

    function eksekusiUploadCSVVendor() {
  const filePicker = document.getElementById('vendorCsvPicker');
  if (!filePicker || filePicker.files.length === 0) { Swal.fire('Waduh!', 'Pilih file .csv vendor!', 'warning'); return; }
  const file = filePicker.files[0];
  const reader = new FileReader();
  showLoader(true);
  
  reader.onload = async function (e) {
    try {
      const lines = e.target.result.split(/\r?\n/);
      const jsonBody = [];
      let itemGagalCount = 0;

      // 🌟 KUNCI PERBAIKAN 2: Membaca posisi urutan kolom secara dinamis berdasarkan Header CSV
      const headers = lines[0].split(",").map(h => h.trim().toLowerCase());
      const idxNama = headers.indexOf("nama_seragam");
      const idxGender = headers.indexOf("gender");
      const idxUkuran = headers.indexOf("ukuran");
      const idxJumlah = headers.indexOf("jumlah");
      const idxNota = headers.indexOf("nota_vendor");

      if (idxNama === -1 || idxGender === -1 || idxUkuran === -1 || idxJumlah === -1) {
        throw new Error("Format header CSV salah! Pastikan kolom wajib ini ada: nama_seragam, gender, ukuran, jumlah");
      }

      for (let i = 1; i < lines.length; i++) {
        const row = lines[i].split(",");
        if (row.length <= 1 || row[idxNama]?.trim() === "") continue;

        const csvNama = row[idxNama].trim().toLowerCase();
        const csvGender = row[idxGender].trim().toLowerCase();
        const csvUkuran = row[idxUkuran].trim().toLowerCase();
        const csvJumlah = parseInt(row[idxJumlah]?.trim() || "0");
        const csvNota = idxNota !== -1 ? (row[idxNota]?.trim() || '-') : '-';

        // 🌟 FILTRASI PINTAR: Lewati otomatis jatah ukuran baju yang jumlahnya 0 agar tidak mengotori database
        if (isNaN(csvJumlah) || csvJumlah <= 0) continue;

        // Mencari id seragam asli di database berdasarkan kombinasi nama, gender, dan ukuran teks
        const cocok = cachedMasterSeragam.find(m => 
          m.nama_seragam.toLowerCase().trim() === csvNama &&
          m.gender.toLowerCase().trim() === csvGender &&
          m.ukuran.toLowerCase().trim() === csvUkuran
        );

        if (cocok) {
          jsonBody.push({
            tipe_transaksi: "MASUK",
            jenis_sumber: "Vendor",
            seragam_id: cocok.id,
            jumlah: csvJumlah,
            keterangan: `Penerimaan Vendor Nota: ${csvNota}`
          });
        } else {
          itemGagalCount++;
          console.warn(`Tidak cocok dengan database: ${row[idxNama]} | ${row[idxGender]} | ${row[idxUkuran]}`);
        }
      }

      if (jsonBody.length === 0) {
        throw new Error("Tidak ada data baju (dengan jumlah > 0) yang cocok dengan spesifikasi Master Seragam.");
      }

      const res = await fetch(`${SUPABASE_URL}/rest/v1/transaksi_seragam`, {
        method: "POST", 
        headers: { ...supabaseHeaders, "Prefer": "return=minimal" }, 
        body: JSON.stringify(jsonBody)
      });

      if (res.ok) { 
        if (itemGagalCount > 0) {
          Swal.fire('Sukses Parsial!', `Stok berhasil masuk. Ada ${itemGagalCount} baris dilewati karena salah ketik nama/ukuran baju (Cek Console).`, 'warning');
        } else {
          Swal.fire('Sukses!', 'Seluruh jatah stok baru dari vendor berhasil masuk ke gudang!', 'success');
        }
        renderSeragamMasuk(); 
      } else {
        throw new Error("Gagal mengirim paket data mutasi masuk ke Supabase.");
      }
    } catch (err) { 
      Swal.fire('Gagal!', err.message, 'error'); 
    } finally {
      showLoader(false);
    }
  };
  reader.readAsText(file);
}

    function downloadAsetCSV() {
      const query = (document.getElementById('filterAset')?.value || '').toLowerCase().trim();
      const data = query
        ? _asetKaryawanData.filter(k =>
            (k.nama_lengkap || '').toLowerCase().includes(query) ||
            (k.departemen_store || '').toLowerCase().includes(query)
          )
        : _asetKaryawanData;

      if (!data.length) { Swal.fire('Info', 'Tidak ada data untuk diunduh.', 'info'); return; }

      const headers = ['Departemen/Store','NIP','Nama Lengkap','Posisi Kerja','Status','Kemeja','QTY Kemeja','Kaos Polo','QTY Kaos Polo','Jas APT','QTY Jas APT','Jas TTK','QTY Jas TTK'];
      const rows = data.map(k => [
        k.departemen_store || '',
        k.nip || '',
        k.nama_lengkap || '',
        k.posisi_kerja || '',
        k.status || '',
        k.kemeja || '',
        k.qty_kemeja ?? 0,
        k.kaos_polo || '',
        k.qty_kaos_polo ?? 0,
        k.jas_apt || '',
        k.qty_jas_apt ?? 0,
        k.jas_ttk || '',
        k.qty_jas_ttk ?? 0,
      ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(','));

      const csv = [headers.join(','), ...rows].join('\n');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const label = query ? `_filter_${query}` : '_semua';
      a.download = `master_aset_karyawan${label}_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function bukaModalTambahKaryawan() {
      const modalEl = document.getElementById('modalTambahKaryawan');
      if (!modalEl) { renderMasterAsetKaryawan().then(() => bukaModalTambahKaryawan()); return; }
      const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
      // Reset form
      ['inputDepartemen','inputNIP','inputNamaLengkap','inputPosisiKerja'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
      ['inputQtyKemeja','inputQtyKaos','inputQtyJasAPT','inputQtyJasTTK'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '0';
      });
      ['inputKemeja','inputKaosPolo','inputJasAPT','inputJasTTK'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
      const statusEl = document.getElementById('inputStatus');
      if (statusEl) statusEl.value = 'AKTIF';
      modal.show();
    }

    async function simpanKaryawanBaru() {
      const nip = document.getElementById('inputNIP').value.trim();
      const departemen = document.getElementById('inputDepartemen').value.trim();
      const nama = document.getElementById('inputNamaLengkap').value.trim();
      const posisi = document.getElementById('inputPosisiKerja').value.trim();

      if (!nip) { Swal.fire('Validasi Gagal!', 'NIP tidak boleh kosong. NIP adalah identitas unik karyawan.', 'warning'); return; }
      if (!nama) { Swal.fire('Validasi Gagal!', 'Nama Lengkap tidak boleh kosong.', 'warning'); return; }

      const payload = {
        nip: nip,
        departemen_store: departemen,
        nama_lengkap: nama,
        posisi_kerja: posisi,
        status: document.getElementById('inputStatus').value,
        kemeja: document.getElementById('inputKemeja').value || null,
        qty_kemeja: parseInt(document.getElementById('inputQtyKemeja').value) || 0,
        kaos_polo: document.getElementById('inputKaosPolo').value || null,
        qty_kaos_polo: parseInt(document.getElementById('inputQtyKaos').value) || 0,
        jas_apt: document.getElementById('inputJasAPT').value || null,
        qty_jas_apt: parseInt(document.getElementById('inputQtyJasAPT').value) || 0,
        jas_ttk: document.getElementById('inputJasTTK').value || null,
        qty_jas_ttk: parseInt(document.getElementById('inputQtyJasTTK').value) || 0,
      };

      showLoader(true);
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/master_aset_karyawan`, {
          method: "POST",
          headers: { ...supabaseHeaders, "Prefer": "return=minimal" },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          const modalEl = document.getElementById('modalTambahKaryawan');
          if (modalEl) bootstrap.Modal.getInstance(modalEl)?.hide();
          Swal.fire('Berhasil!', `Data karyawan ${nama} berhasil ditambahkan!`, 'success');
          renderMasterAsetKaryawan();
        } else {
          const errData = await res.json();
          throw new Error(errData.message || `HTTP ${res.status} - Gagal menyimpan data.`);
        }
      } catch (err) {
        Swal.fire('Gagal!', err.message, 'error');
      } finally {
        showLoader(false);
      }
    }

    async function patchAsetField(nip, field, value) {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/master_aset_karyawan?nip=eq.${encodeURIComponent(nip)}`, {
          method: "PATCH",
          headers: { ...supabaseHeaders, "Prefer": "return=minimal" },
          body: JSON.stringify({ [field]: value })
        });
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.message || `Gagal update field ${field}.`);
        }
        // Toast sukses kecil tanpa popup besar
        const Toast = Swal.mixin({ toast: true, position: 'bottom-end', showConfirmButton: false, timer: 1500, timerProgressBar: true });
        Toast.fire({ icon: 'success', title: `${field.replace(/_/g,' ')} tersimpan` });
      } catch (err) {
        Swal.fire('Gagal Menyimpan!', err.message, 'error');
      }
    }

    async function hapusAsetKaryawan(nip, nama) {
      const result = await Swal.fire({
        title: 'Hapus Data Karyawan?',
        html: `Data aset <strong>${nama}</strong> (NIP: ${nip}) akan dihapus permanen dari database.<br><br>Tindakan ini tidak bisa dibatalkan!`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#dc3545',
        confirmButtonText: 'Ya, Hapus!',
        cancelButtonText: 'Batal'
      });
      if (!result.isConfirmed) return;

      showLoader(true);
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/master_aset_karyawan?nip=eq.${encodeURIComponent(nip)}`, {
          method: "DELETE",
          headers: supabaseHeaders
        });
        if (res.ok) {
          Swal.fire('Terhapus!', `Data karyawan ${nama} berhasil dihapus.`, 'success');
          renderMasterAsetKaryawan();
        } else {
          throw new Error(`HTTP ${res.status} - Gagal menghapus data karyawan.`);
        }
      } catch (err) {
        Swal.fire('Gagal!', err.message, 'error');
      } finally {
        showLoader(false);
      }
    }

    // ==========================================
    // 8. MENU SERAGAM DESTROY
    // Memotong stok_destroy di stok_seragam dan mencatat log transaksi
    // ==========================================
    async function renderSeragamDestroy() {
      showLoader(true);
      try {
        // Cukup fetch dari stok_seragam saja — semua kolom (nama, gender, ukuran, stok_destroy) sudah ada di sini
        const resStok = await fetch(`${SUPABASE_URL}/rest/v1/stok_seragam?order=id.asc`, { headers: supabaseHeaders });
        if (!resStok.ok) throw new Error(`HTTP ${resStok.status} - Gagal memuat data dari tabel 'stok_seragam'.`);

        const stokList = await resStok.json();

        // Item yang punya stok_destroy > 0 = menunggu pemusnahan
        const itemDestroy = stokList.filter(s => (s.stok_destroy || 0) > 0);

        // Dropdown opsi: tampilkan semua item, dengan info stok destroy
        const opsiSeragam = stokList.map(s =>
          `<option value="${s.id}" data-max="${s.stok_destroy || 0}">
            ${s.nama_seragam} - ${s.gender} (${s.ukuran}) | Stok Tidak Layak: ${s.stok_destroy || 0} pcs
          </option>`
        ).join('');

        const rowsDestroy = itemDestroy.length > 0
          ? itemDestroy.map(s => `
            <tr>
              <td class="ps-3"><strong>#${s.id}</strong></td>
              <td>${s.nama_seragam}</td>
              <td><span class="badge bg-secondary">${s.gender}</span></td>
              <td>${s.ukuran}</td>
              <td class="fw-bold text-danger">${s.stok_destroy} pcs</td>
              <td>
                <button class="btn btn-sm btn-danger"
                  onclick="prosesDestroyItem(${s.id}, '${s.nama_seragam} - ${s.gender} (${s.ukuran})', ${s.stok_destroy})">
                  <i class="bi bi-fire me-1"></i> Proses Destroy
                </button>
              </td>
            </tr>`).join('')
          : `<tr><td colspan="6" class="text-center py-4 text-muted">
              <i class="bi bi-check-circle text-success fs-4 d-block mb-2"></i>
              Tidak ada stok seragam yang perlu di-destroy saat ini.
            </td></tr>`;

        document.getElementById('app').innerHTML = `
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold mb-0 text-danger"><i class="bi bi-trash3-fill me-2"></i>Seragam Destroy / Pemusnahan</h3>
          </div>

          <!-- Form Input Manual Destroy -->
          <div class="card border-0 shadow-sm bg-white mb-4">
            <div class="card-header bg-danger text-white fw-bold">
              <i class="bi bi-box-arrow-right me-2"></i>Form Pemusnahan Seragam Tidak Layak
            </div>
            <div class="card-body p-4">
              <div class="row g-3 align-items-end">
                <div class="col-md-5">
                  <label class="form-label fw-bold small">Pilih Jenis Seragam</label>
                  <select id="destroySeragamId" class="form-select" onchange="updateMaxDestroy(this)">
                    <option value="">-- Pilih Item Seragam --</option>
                    ${opsiSeragam}
                  </select>
                </div>
                <div class="col-md-2">
                  <label class="form-label fw-bold small">Jumlah Destroy (Pcs)</label>
                  <input type="number" id="destroyJumlah" class="form-control" min="1" value="1">
                  <small id="destroyMaxInfo" class="text-muted"></small>
                </div>
                <div class="col-md-3">
                  <label class="form-label fw-bold small">Keterangan / Alasan</label>
                  <input type="text" id="destroyKeterangan" class="form-control" placeholder="Contoh: Musnah batch Juni 2026">
                </div>
                <div class="col-md-2">
                  <button class="btn btn-danger w-100 fw-bold" onclick="simpanDestroy()">
                    <i class="bi bi-fire me-1"></i> Eksekusi Destroy
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Tabel stok destroy yang menunggu -->
          <div class="card border-0 shadow-sm bg-white">
            <div class="card-header bg-light fw-bold text-dark">
              <i class="bi bi-list-ul me-2"></i>Daftar Stok Tidak Layak Menunggu Pemusnahan
              <span class="badge bg-danger ms-2">${itemDestroy.length} item</span>
            </div>
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead class="table-dark text-uppercase small">
                    <tr>
                      <th class="ps-3">Kode</th>
                      <th>Nama Seragam</th>
                      <th>Gender</th>
                      <th>Ukuran</th>
                      <th>Stok Destroy</th>
                      <th>Aksi</th>
                    </tr>
                  </thead>
                  <tbody>${rowsDestroy}</tbody>
                </table>
              </div>
            </div>
            <div class="card-footer bg-light text-muted small">
              Stok destroy terisi otomatis saat karyawan resign mengembalikan seragam dengan kondisi <strong>Tidak Layak</strong>.
            </div>
          </div>
        `;
      } catch (err) {
        console.error(err);
        showError(err.message);
      } finally {
        showLoader(false);
      }
    }

    function updateMaxDestroy(selectEl) {
      const max = selectEl.options[selectEl.selectedIndex]?.dataset?.max || 0;
      document.getElementById('destroyJumlah').max = max;
      document.getElementById('destroyMaxInfo').textContent = max > 0 ? `Maks: ${max} pcs` : '';
    }

    async function simpanDestroy() {
      const seragamId   = parseInt(document.getElementById('destroySeragamId').value);
      const jumlah      = parseInt(document.getElementById('destroyJumlah').value);
      const keterangan  = document.getElementById('destroyKeterangan').value.trim() || 'Pemusnahan seragam tidak layak';
      const maxDestroy  = parseInt(document.getElementById('destroySeragamId').options[document.getElementById('destroySeragamId').selectedIndex]?.dataset?.max || 0);

      if (!seragamId)        { Swal.fire('Peringatan!', 'Pilih jenis seragam terlebih dahulu.', 'warning'); return; }
      if (!jumlah || jumlah < 1) { Swal.fire('Peringatan!', 'Jumlah destroy harus minimal 1 pcs.', 'warning'); return; }
      if (jumlah > maxDestroy)   { Swal.fire('Tidak Bisa!', `Jumlah destroy (${jumlah}) melebihi stok tidak layak yang tersedia (${maxDestroy} pcs).`, 'error'); return; }

      const confirm = await Swal.fire({
        title: 'Konfirmasi Pemusnahan',
        html: `<strong>${jumlah} pcs</strong> seragam akan dimusnahkan permanen.<br>
               Stok tidak layak akan berkurang sebesar ${jumlah} pcs.<br><br>
               <span class="text-danger fw-bold">Tindakan ini tidak dapat dibatalkan!</span>`,
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#dc3545',
        confirmButtonText: 'Ya, Musnahkan!',
        cancelButtonText: 'Batal'
      });
      if (!confirm.isConfirmed) return;

      showLoader(true);
      try {
        // 1. Catat log transaksi KELUAR - Destroy
        const resTx = await fetch(`${SUPABASE_URL}/rest/v1/transaksi_seragam`, {
          method: "POST",
          headers: supabaseHeaders,
          body: JSON.stringify({
            tipe_transaksi: "KELUAR",
            jenis_sumber: "Destroy",
            seragam_id: seragamId,
            jumlah: jumlah,
            keterangan: keterangan
          })
        });
        if (!resTx.ok) throw new Error("Gagal mencatat log transaksi destroy.");

        // 2. Kurangi stok_destroy di tabel stok_seragam
        const resStok = await fetch(`${SUPABASE_URL}/rest/v1/rpc/decrement_stok_destroy`, {
          method: "POST",
          headers: supabaseHeaders,
          body: JSON.stringify({ p_seragam_id: seragamId, p_qty: jumlah })
        });
        if (!resStok.ok) throw new Error("Log destroy tersimpan, tapi gagal update stok_seragam. Periksa function RPC 'decrement_stok_destroy'.");

        Swal.fire('Berhasil Dimusnahkan!', `${jumlah} pcs seragam berhasil di-destroy dan stok diperbarui.`, 'success');
        renderSeragamDestroy();
      } catch (err) {
        Swal.fire('Gagal!', err.message, 'error');
      } finally {
        showLoader(false);
      }
    }

    async function prosesDestroyItem(seragamId, namaSeragam, maxStok) {
      const { value: jumlah } = await Swal.fire({
        title: `Destroy: ${namaSeragam}`,
        html: `Stok tidak layak tersedia: <strong>${maxStok} pcs</strong><br>Berapa pcs yang akan dimusnahkan?`,
        input: 'number',
        inputAttributes: { min: 1, max: maxStok, step: 1 },
        inputValue: maxStok,
        showCancelButton: true,
        confirmButtonColor: '#dc3545',
        confirmButtonText: 'Musnahkan',
        cancelButtonText: 'Batal',
        inputValidator: (v) => {
          if (!v || v < 1)      return 'Jumlah harus minimal 1!';
          if (v > maxStok)      return `Maks ${maxStok} pcs!`;
        }
      });
      if (!jumlah) return;

      showLoader(true);
      try {
        const resTx = await fetch(`${SUPABASE_URL}/rest/v1/transaksi_seragam`, {
          method: "POST",
          headers: supabaseHeaders,
          body: JSON.stringify({
            tipe_transaksi: "KELUAR",
            jenis_sumber: "Destroy",
            seragam_id: seragamId,
            jumlah: parseInt(jumlah),
            keterangan: `Pemusnahan batch dari daftar stok tidak layak: ${namaSeragam}`
          })
        });
        if (!resTx.ok) throw new Error("Gagal mencatat log transaksi destroy.");

        const resStok = await fetch(`${SUPABASE_URL}/rest/v1/rpc/decrement_stok_destroy`, {
          method: "POST",
          headers: supabaseHeaders,
          body: JSON.stringify({ p_seragam_id: seragamId, p_qty: parseInt(jumlah) })
        });
        if (!resStok.ok) throw new Error("Log tersimpan tapi gagal update stok_destroy. Cek RPC 'decrement_stok_destroy'.");

        Swal.fire('Berhasil!', `${jumlah} pcs ${namaSeragam} berhasil dimusnahkan.`, 'success');
        renderSeragamDestroy();
      } catch (err) {
        Swal.fire('Gagal!', err.message, 'error');
      } finally {
        showLoader(false);
      }
    }

    window.onload = function() { 
      renderDashboard(); 
    };
